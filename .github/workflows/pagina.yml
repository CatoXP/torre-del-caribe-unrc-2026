# Autor: Brandon Uriel García Sánchez
# Qué hace:  Publica la carpeta frontend/ en GitHub Pages cada vez que se sube un cambio a master.
# Por qué así: Pages solo sirve desde la raíz o /docs; con esta acción se publica frontend/ tal cual, sin mover
#              archivos. La página es estática (datos en frontend/datos/pagina.js), no necesita servidor.
name: Publicar la página

on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/pagina.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: despliegue
        uses: actions/deploy-pages@v4
